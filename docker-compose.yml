services:
  postgres:
    image: postgres:18
    container_name: busaum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: busaum
      POSTGRES_PASSWORD: busaum
      POSTGRES_DB: busaum_dev
    ports:
      - "5432:5432"
    volumes:
      - busaum_pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busaum -d busaum_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  busaum_pgdata:
